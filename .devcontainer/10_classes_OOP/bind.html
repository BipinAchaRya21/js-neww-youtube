<!---Bind concept in javascript used to bind the function with the object and we can use that 
function in another object and we can also pass the parameter in that function and
we can also use the bind method
without bind function forgets owenr
with bind function remember owenr--->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button click</button>
</body>
<script>
    class React{
        constructor(){
            this.library="React";
            this.server="http://localhost:300";
            //requirement
            document.querySelector('button').addEventListener('click',this.handleClick.bind(this))
        }
        handleClick(){
            console.log("Button clicked");
            console.log(this.server);
        }
    }
</script>
</html>
